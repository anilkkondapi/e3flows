<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500">
<defs><style>.t{font-family:Arial,sans-serif}.mono{font-family:Menlo,monospace}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#76b900"/></marker></defs>
<rect width="100%" height="100%" fill="#080b0f"/>
<text x="50" y="55" fill="#76b900" font-size="18" font-weight="700" class="t" letter-spacing="3">GENERATED SUBSYSTEM EFS</text>
<text x="50" y="88" fill="#e8edf2" font-size="28" font-weight="700" class="t">Matrix-compute AXI execution sequence</text>
<rect x="230" y="115" width="220" height="54" rx="6" fill="#111820" stroke="#76b900"/><text x="340" y="149" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" class="t">Manager</text>
<rect x="1050" y="115" width="220" height="54" rx="6" fill="#111820" stroke="#76b900"/><text x="1160" y="149" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" class="t">Subordinate</text>
<line x1="340" y1="169" x2="340" y2="1450" stroke="#3b4651" stroke-dasharray="8 8"/>
<line x1="1160" y1="169" x2="1160" y2="1450" stroke="#3b4651" stroke-dasharray="8 8"/>
<rect x="70" y="190" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="212" fill="#9ddd20" font-size="14" font-weight="700" class="t">SYSTEM INITIALIZATION</text>
<line x1="340" y1="258" x2="1160" y2="258" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="249" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">rst_n = 0</text>
<line x1="340" y1="306" x2="1160" y2="306" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="297" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">clk = [clock]</text>
<rect x="70" y="334" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="356" fill="#9ddd20" font-size="14" font-weight="700" class="t">EXECUTION TRIGGER</text>
<line x1="340" y1="402" x2="1160" y2="402" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="393" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">start = 1</text>
<line x1="340" y1="450" x2="1160" y2="450" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="441" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">instruction = [opcode]</text>
<rect x="70" y="478" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="500" fill="#9ddd20" font-size="14" font-weight="700" class="t">EXECUTION STATUS</text>
<rect x="440" y="528" width="620" height="42" rx="6" fill="#142333" stroke="#4c789f"/>
<text x="750" y="554" text-anchor="middle" fill="#cfe8ff" font-size="13" class="mono">busy is asserted while operation is in progress</text>
<rect x="440" y="586" width="620" height="42" rx="6" fill="#142333" stroke="#4c789f"/>
<text x="750" y="612" text-anchor="middle" fill="#cfe8ff" font-size="13" class="mono">done or error is checked to exit</text>
<rect x="70" y="642" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="664" fill="#9ddd20" font-size="14" font-weight="700" class="t">WHILE (Subordinate -&gt; Manager: busy == 1)</text>
<rect x="440" y="692" width="620" height="42" rx="6" fill="#142333" stroke="#4c789f"/>
<text x="750" y="718" text-anchor="middle" fill="#cfe8ff" font-size="13" class="mono">note right of Subordinate: AXI protocol checking</text>
<rect x="70" y="748" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="770" fill="#9ddd20" font-size="14" font-weight="700" class="t">IF (Manager -&gt; Subordinate: axi_awvalid = 1) &amp; (Subordinate -&gt; Manager: axi_awready = 1)</text>
<line x1="340" y1="816" x2="1160" y2="816" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="807" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_awaddr = [waddr]</text>
<rect x="70" y="844" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="866" fill="#9ddd20" font-size="14" font-weight="700" class="t">IF (Manager -&gt; Subordinate: axi_wvalid = 1) &amp; (Subordinate -&gt; Manager: axi_wready = 1)</text>
<line x1="340" y1="912" x2="1160" y2="912" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="903" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_wdata[511:0] = [data]</text>
<line x1="340" y1="960" x2="1160" y2="960" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="951" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_wstrb[63:0] = [strb]</text>
<line x1="340" y1="1008" x2="1160" y2="1008" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="999" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_wlast = 1</text>
<rect x="70" y="1036" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="1058" fill="#9ddd20" font-size="14" font-weight="700" class="t">IF (Manager -&gt; Subordinate: instruction == MSTORE)</text>
<line x1="1160" y1="1104" x2="340" y2="1104" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="1095" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_bresp = 0</text>
<rect x="70" y="1132" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="1154" fill="#9ddd20" font-size="14" font-weight="700" class="t">IF (Manager -&gt; Subordinate: axi_arvalid = 1) &amp; (Subordinate -&gt; Manager: axi_arready = 1)</text>
<line x1="340" y1="1200" x2="1160" y2="1200" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="1191" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_araddr = [raddr]</text>
<rect x="70" y="1228" width="1360" height="32" rx="4" fill="#76b900" fill-opacity=".1" stroke="#76b900" stroke-opacity=".35"/>
<text x="90" y="1250" fill="#9ddd20" font-size="14" font-weight="700" class="t">IF (Subordinate -&gt; Manager: axi_rvalid = 1) &amp; (Manager -&gt; Subordinate: axi_rready = 1)</text>
<line x1="1160" y1="1296" x2="340" y2="1296" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="1287" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_rdata[511:0] = [rdata]</text>
<line x1="1160" y1="1344" x2="340" y2="1344" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="1335" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_rlast = 1</text>
<line x1="1160" y1="1392" x2="340" y2="1392" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
<text x="750.0" y="1383" text-anchor="middle" fill="#e7edf2" font-size="13" class="mono">axi_rresp = 0</text>
</svg>